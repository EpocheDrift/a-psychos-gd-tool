name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:mcp:authority
      - run: npm run check:mcp:stdio
      - run: npm run check:agent-artifacts

  agent-e2e:
    needs: test
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:agent
      - run: npm run build:mcp
      - run: node scripts/mcp-e2e-check.mjs
      - run: node scripts/agent-eval-check.mjs
        timeout-minutes: 10
      - name: Upload Agent evaluation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-eval-evidence
          path: test-results/agent-evals
          if-no-files-found: ignore
