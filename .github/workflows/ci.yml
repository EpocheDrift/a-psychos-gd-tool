name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm run check:font
      - run: npm ci
      - run: npm run check:versions
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:agent-artifacts

  agent-e2e:
    needs: test
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:agent
      - run: npm run build:mcp
      - run: npm run check:mcp:stdio
      - run: node scripts/mcp-e2e-check.mjs
      - run: node scripts/agent-eval-check.mjs
        timeout-minutes: 10
      - name: Run stable WebGPU smoke subset
        run: npm run smoke:ci
        env:
          SMOKE_ARTIFACT_DIR: test-results/smoke
      - name: Upload Agent evaluation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-eval-evidence
          path: |
            test-results/agent-evals
            test-results/smoke
          if-no-files-found: ignore
          retention-days: 14
