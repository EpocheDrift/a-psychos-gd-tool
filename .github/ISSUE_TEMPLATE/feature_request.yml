name: Feature request
description: Propose a focused product, Agent, or contributor improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Who is blocked, and what are they trying to accomplish?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the user-visible result, not only an implementation.
    validations:
      required: true
  - type: dropdown
    id: workflow
    attributes:
      label: Primary workflow
      options:
        - Human Web UI
        - Human + Agent on 5199
        - MCP host integration
        - Rendering or node system
        - Contributor or release workflow
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Constraints and trade-offs
      description: Note compatibility, security, privacy, licensing, or migration concerns.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and documentation first.
          required: true
